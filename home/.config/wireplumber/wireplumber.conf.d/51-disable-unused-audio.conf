# Keep the NVIDIA HDMI output and Blue Microphones input. These rules match
# hardware properties instead of PipeWire's transient numeric object IDs.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Generic_Blue_Microphones_.*" }
    ]
    actions = {
      update-props = {
        device.profile-set = "blue-microphones-input.conf"
      }
    }
  }
  {
    matches = [
      { device.name = "~alsa_card.usb-046d_HD_Pro_Webcam_C920_.*" }
      { device.name = "alsa_card.pci-0000_08_00.4" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

# Prefer the Blue card's input-only profile if no saved selection exists.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Generic_Blue_Microphones_.*" }
    ]
    actions = {
      update-props = {
        priorities = [ "input:analog-stereo" ]
      }
    }
  }
]

# Keep A2DP playback but omit HSP/HFP handsfree profiles from Bluetooth cards.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source ]
}
